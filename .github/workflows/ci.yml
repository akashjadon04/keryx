name: Keryx CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Build & Verify Keryx Engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate Syntax & Modules
        run: |
          node -c server.js
          node -c lib/tools.js
          node -c lib/license-beacon.js
          echo "Keryx Gateway core files syntax verified."
